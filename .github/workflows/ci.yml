name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      # Chrome opens real windows in a few tests (the DeepSeek sign-in check): a virtual display gives it one
      - run: command -v xvfb-run >/dev/null || sudo apt-get install -y xvfb
      - run: xvfb-run -a npm test
